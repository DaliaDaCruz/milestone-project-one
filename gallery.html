<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--meta tags for screen engines-->
    <meta name="description" content="clean, cleaning, sanitising, business cleaning, London">
    <meta name="keywords"
        content="clean, cleaning, sanitise, car cleaning, matress cleaning, sanitising, London, business cleaners">
    <title>Gallery | Eco SanitAll</title>

    <!--Favicon generated with redketchup.io-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

    <!--stylesheet-->
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">

    <!-- Gallery Custom Button Styles -->
    <style>
        .gallery-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 20px;
        }

        .ss-icon {
            display: inline-block;
            font-size: 3rem;
            color: rgb(64, 159, 218);
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .ss-icon:hover {
            color: rgb(30, 80, 120);
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <!--header-->
    <header>
        <a href="index.html">
            <h1 id="logo">Eco SanitAll</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">☰</label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!--main content-->
    <main>
        <div id="carousel">
            <figure id="spinner">
                <img src="assets/images/armchair.jpeg" alt="armchair cleaning">
                <img src="assets/images/ape.jpeg" alt="food trailer van">
                <img src="assets/images/buggy.jpeg" alt="Buggy">
                <img src="assets/images/car.jpg" alt="car cleaning">
                <img src="assets/images/guest-bed.jpeg" alt="guest bed hotel">
                <img src="assets/images/hotel.jpeg" alt="hotel carpet/matress">
                <img src="assets/images/leather-car-clean.jpg" alt="leather car cleaning">
                <img src="assets/images/rug.jpeg" alt="rug cleaning">
            </figure>
        </div>

        <!-- Interactive Navigation Controls -->
        <div class="gallery-controls">
            <span class="ss-icon" onclick="gallerySpin(1)" title="Previous Image">&#10094;</span>
            <span class="ss-icon" onclick="gallerySpin(-1)" title="Next Image">&#10095;</span>
        </div>

        <section id="gallery-header">
            <h2>Before & After</h2>
            <p>Take a look at some of our recent eco-friendly jobs.</p>
            <hr>
        </section>
    </main>

    <!--footer-->
    <footer>
        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in a new tab)">
                    <i class="fa-brands fa-facebook"></i></a>
            </li>
            <li>
                <a href="https://www.tiktok.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Tiktok page (opens in a new tab)">
                    <i class="fa-brands fa-tiktok"></i></a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in a new tab)">
                    <i class="fa-brands fa-instagram"></i></a>
            </li>
        </ul>
    </footer>

    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/3b20d96fa9.js" crossorigin="anonymous"></script>

    <!-- Carousel Controls JavaScript -->
    <script>
        var angle = 0;
        var spinner = document.getElementById("spinner");
        var timer;

        function gallerySpin(sign) {
            // Sign = 1 turns right (+45 deg), Sign = -1 turns left (-45 deg)
            angle += sign * 45;
            spinner.style.transform = "rotateY(" + angle + "deg)";
            
            // Reset auto timer on manual click so it doesn't spin immediately again
            resetTimer();
        }

        function autoSpin() {
            angle -= 45;
            spinner.style.transform = "rotateY(" + angle + "deg)";
        }

        function resetTimer() {
            clearInterval(timer);
            timer = setInterval(autoSpin, 4500); // Rotates every 4.5 seconds (slower & cleaner)
        }

        // Start auto-rotation on page load
        resetTimer();
    </script>
</body>

</html>
